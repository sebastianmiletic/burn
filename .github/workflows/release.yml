name: Build and release

# Push a tag like v0.3.1 to build Windows, macOS and Linux and publish a
# GitHub Release. Each release also carries per-platform data packs
# (burn-<version>-<platform>-godot<engine>.pck) that running copies of the
# game download to update themselves (core/updater.gd).
# "Run workflow" on the Actions tab builds without releasing (artifacts only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -oP 'config/version="\K[^"]+' project.godot)-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/^config\/version=.*/config\/version=\"$VERSION\"/" project.godot

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}

      - name: Install Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_TAG}_linux.x86_64 godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import assets
        run: |
          mkdir -p build/validation
          ~/godot/godot --headless --path . --import --log-file "$PWD/build/validation/import-engine.log" 2>&1 | tee build/validation/import.log
          python3 tools/check_log.py build/validation/import.log

      - name: Unit tests
        run: |
          ~/godot/godot --headless --path . --log-file "$PWD/build/validation/unit-engine.log" -s res://tests/run_tests.gd -- --data-dir="$PWD/build/validation/user" 2>&1 | tee build/validation/unit.log
          python3 tools/check_log.py build/validation/unit.log

      - name: Playthrough and multiplayer
        run: |
          ~/godot/godot --headless --path . --log-file "$PWD/build/validation/play-engine.log" -- --playtest --no-update --data-dir="$PWD/build/validation/play-user" 2>&1 | tee build/validation/play.log
          python3 tools/check_log.py build/validation/play.log
          ~/godot/godot --headless --path . --log-file "$PWD/build/validation/flow-engine.log" -s res://tests/game/flow_test.gd -- --data-dir="$PWD/build/validation/flow-user" 2>&1 | tee build/validation/flow.log
          python3 tools/check_log.py build/validation/flow.log
          GODOT=~/godot/godot bash tests/net/run_net_test.sh
          GODOT=~/godot/godot bash tests/net/run_game_mp_test.sh --address --latency 150 --loss 0.02

      - name: Export
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          mkdir -p build/windows build/linux build/macos dist
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/Burn.exe
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/Burn.x86_64
          ~/godot/godot --headless --path . --export-release "macOS" build/macos/Burn.zip
          for p in Windows Linux macOS; do
            lower=$(echo $p | tr '[:upper:]' '[:lower:]')
            ~/godot/godot --headless --path . --export-pack "$p" "dist/burn-$V-$lower-godot${GODOT_VERSION}.pck"
          done
          (cd build/windows && zip -q -r ../../dist/Burn-$V-Windows.zip .)
          (cd build/linux && chmod +x Burn.x86_64 && tar -czf ../../dist/Burn-$V-Linux.tar.gz Burn.x86_64)
          cp build/macos/Burn.zip dist/Burn-$V-macOS.zip
          cp README.md CREDITS.md dist/
          (cd dist && sha256sum *.zip *.tar.gz *.pck > SHA256SUMS.txt)
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: burn-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Burn ${{ steps.ver.outputs.version }}
          # Preview until native Windows/Linux/macOS release testing is recorded.
          # GitHub /releases/latest (the updater) intentionally excludes previews.
          prerelease: true
          generate_release_notes: true
          files: dist/*
